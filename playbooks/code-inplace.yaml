name: code-inplace
description: >-
  Code changes in-place: research, design with review loop, implementation, test-and-fix
  loop, final code review. Honest naming (builds on project dir, no sandbox). Requires project_dir.
needsProjectDir: true
stages:
  - type: single
    id: research
    role: ziad
    brief: >-
      Research everything needed to design and build this task well: relevant
      libraries, patterns, prior art in the working directory, pitfalls.

  - type: loop
    id: design
    producer: kai
    critic: yara
    maxRounds: 3
    brief: >-
      Design the solution for the task using the research brief.

  - type: single
    id: implement
    role: maya
    brief: >-
      Implement the approved design directly in the project_dir working directory. This is the
      user's REAL checkout — changes are NOT sandboxed. Match existing style; run builds to verify.

  - type: verify
    id: test
    runner: tarek
    fixer: maya
    maxRounds: 2
    brief: >-
      Verify the implementation: build and run tests.

  - type: single
    id: code-review
    role: nadia
    brief: >-
      Review the new implementation (git diff against the state before this job if possible).
