# agents/_capabilities.yaml — the Capability primitive (org-model spec §3).
# server: name in SERVER_BUILDERS (src/agents/resolve.ts). guard: name in NAMED_GUARDS
# (src/agents/guards/index.ts). labels feed the Information-Flow Policy spec (declared
# here, enforced there). Tool lists are exact — the org-golden fixture is the arbiter.

# -- generic tool bundles ------------------------------------------------------
files-ro:    { tools: [Read, Grep, Glob] }
reading:     { tools: [Read] }
editing:     { tools: [Edit, Write] }
drafting:    { tools: [Write] }
todo:        { tools: [TodoWrite] }
shell:       { tools: [Bash] }
web:         { tools: [WebSearch, WebFetch] }
web-fetch:   { tools: [WebFetch], guard: web-fetch-public }   # fetch-only citation spot-checks (minos); SSRF host guard
media-gen:   { server: media, tools: [mcp__media__render_chart, mcp__media__render_diagram, mcp__media__speak, mcp__media__generate_image] }   # charts/diagrams/speech/image out (⑤d + ⑩ nano-banana)

# -- memory / vault (aios-pack server) -----------------------------------------
memory:      { server: aios-pack, tools: [recall, vault_read] }
vault-read:  { server: aios-pack, tools: [vault_read] }
vault-write: { server: aios-pack, tools: [vault_write], actions: [vault.write] }

# -- sandboxed code execution ----------------------------------------------------
code-sandbox: { server: code, tools: [mcp__code__sh], sandbox: true }

# -- domain servers ---------------------------------------------------------------
money-analysis:
  server: money
  labels: [personal.finance]
  tools: [mcp__money__spending_summary, mcp__money__list_transactions,
          mcp__money__list_subscriptions, mcp__money__confirm_subscription,
          mcp__money__dismiss_subscription, mcp__money__add_subscription,
          mcp__money__set_budget, mcp__money__list_budgets,
          mcp__money__budget_status, mcp__money__set_category_rule]
ledger:
  server: ledger
  tools: [mcp__ledger__add_expense, mcp__ledger__remove_expense,
          mcp__ledger__list_expenses, mcp__ledger__settle,
          mcp__ledger__export_csv, mcp__ledger__send_receipt]
research-kb:
  server: research
  tools: [mcp__research__save_source, mcp__research__list_sources, mcp__research__search_sources]
lifeops:
  server: lifeops
  labels: [personal.tasks]
  tools: [mcp__lifeops__add_task, mcp__lifeops__list_tasks, mcp__lifeops__update_task,
          mcp__lifeops__complete_task, mcp__lifeops__dismiss_task]

# -- client systems ------------------------------------------------------------------
halalo-aws:  { server: cloudflare, tools: [mcp__halalo_analytics__cloudflare_analytics], guard: halalo-readonly, labels: [client.halalo] }
attach:      { tools: [mcp__aios_attachments__attach_file] }

# -- guard-only modifiers ---------------------------------------------------------------
ops-guardrail:  { guard: atlas-mutating }
ledger-confine: { guard: ledger-read-confine }

# -- coordination (neo; the aios moderator server itself is seam-attached) -------------
coordination:
  tools: [mcp__aios__run_playbook, mcp__aios__goal_status, mcp__aios__plan_goal,
          mcp__aios__list_playbooks, mcp__aios__hand_off, mcp__aios__send_mail,
          mcp__aios__vault_write, mcp__aios__vault_read, mcp__aios__vault_list,
          mcp__aios__propose_action, mcp__aios__add_reminder, mcp__aios__list_reminders,
          mcp__aios__cancel_reminder, mcp__aios__add_triage_rule, mcp__aios__list_inbox,
          mcp__aios__read_email, mcp__aios__recall, mcp__aios__remember, mcp__aios__forget,
          mcp__aios__add_routine, mcp__aios__list_routines, mcp__aios__update_routine,
          mcp__aios__delete_routine]
